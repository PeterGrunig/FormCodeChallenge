<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Responses: {{.Title}}</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <main>
    <header>
      <p class="eyebrow">Response summary</p>
      <h1>{{.Title}}</h1>
      <p class="intro">Responses collected for each question.</p>
    </header>

    {{range .Questions}}
      <section class="question-card">
        <p class="eyebrow">Question {{.Order}}</p>
        <h2>{{.Question}}</h2>
        <ul class="response-list">
          {{range .Response}}
            <li>{{.}}</li>
          {{else}}
            <li class="empty-state">No responses yet</li>
          {{end}}
        </ul>
      </section>

    {{end}}
      <form action="/" method="get">
        <button type="submit">Home</button>
      </form>
  </main>
</body>
</html>
