<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{.Title}}</title>
</head>
<body>
  <main>
    <h1>{{.Title}}</h1>
    <p> View Form Only. Will not save responses </p>
    {{range .Questions}}
      <section>
        <h2>{{.Question}}</h2>
        <label>
          Response
          <textarea rows="3"></textarea>
        </label>
      </section>
    {{end}}

    <form action="/create?id={{.ID}}" method="post">
      <button type="submit">Edit Form</button>
    </form>

    <form action="/" method="get">
      <button type="submit">Save Form</button>
    </form>
  </main>
</body>
</html>
