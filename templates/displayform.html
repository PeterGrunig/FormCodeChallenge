<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{.Title}}</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <main>
    <header>
      <p class="eyebrow">Form preview</p>
      <h1>{{.Title}}</h1>
      <p class="intro">Review the questions and answer fields before sharing your form.</p>
    </header>
    {{range .Questions}}
      <section class="question-card">
        <p class="eyebrow">Question {{.Order}}</p>
        <h2>{{.Question}}</h2>
        <label>
          Response
          <textarea rows="3"></textarea>
        </label>
      </section>
    {{end}}

    <div class="page-actions">
      <form action="/create?id={{.ID}}" method="post">
        <button class="button-secondary" type="submit">Edit form</button>
      </form>
      <form action="/" method="get">
        <button type="submit">Save form</button>
      </form>
    </div>
  </main>
</body>
</html>
