<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Create form</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <main>
    <header>
      <p class="eyebrow">Form builder</p>
      <h1>Create your form</h1>
      <p class="intro">Give your form a title, then add questions one at a time.</p>
    </header>

    {{if .Notice}}
      <p class="notice" role="status">{{.Notice}}</p>
    {{end}}

    {{if .Form}}
      {{if .Form.Questions}}
        <section class="panel">
          <h2>Questions so far</h2>
          <ol class="question-list">
            {{range .Form.Questions}}
              <li>{{.Question}}</li>
            {{end}}
          </ol>
        </section>
      {{end}}
    {{end}}

    <form class="form-stack" action="/createPost?id={{.Form.ID}}" method="post">
      <label for="title">Form title</label>
      <input id="title" name="title" type="text" value="{{if .Form}}{{.Form.Title}}{{end}}" placeholder="For example, Customer feedback" required>

      <label for="question">New question</label>
      <textarea id="question" name="question" rows="3" placeholder="Write a question for your respondents" required></textarea>

      <button type="submit">Save question</button>
    </form>

    <div class="page-actions">
      <form action="/displayForm?id={{.Form.ID}}" method="post">
        <button class="button-secondary" type="submit">Preview form</button>
      </form>
      <form action="/startFromTemplate?id={{.Form.ID}}" method="post">
        <button class="button-secondary" type="submit">Start from template</button>
      </form>
    </div>
  </main>
</body>
</html>
