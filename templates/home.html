<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Form Forge</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <main>
    <h1>Form Forge</h1>
    <p> Welcome to Form Forge, you can create a template or use an existing one!</p>
    <p>You can view responses</p>
    <p>And you can fill out forms!</p>

    <h2>Current forms</h2>
    <ul>
      {{range .}}
        <li>{{.Title}}</li>
        <form action="/displayForm?id={{.ID}}" method="post">
          <button type="submit">View/Edit Form</button>
        </form>
        <form action="/respondToForm?id={{.ID}}" method="post">
          <button type="submit">Fill out form</button>
        </form>
        <form action="/viewResponses?id={{.ID}}" method="post">
          <button type="submit">View Responses</button>
        </form>
      {{else}}
        <li>No forms yet</li>
      {{end}}
    </ul>

    <form action="/create?id=0" method="post">
      
      <button type="submit">New form</button>
    </form>
  </main>
</body>
</html>
